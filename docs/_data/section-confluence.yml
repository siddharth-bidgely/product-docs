# Optional extra Confluence → markdown targets (legacy). Prefer putting
# confluence_pm_page_ids / confluence_dev_page_ids on the matching page in getting-started.yml,
# api-reference.yml, runbooks.yml, or reference.yml (same shape as feature-map).
#
# Seed merges legacy entries with site YAML; if the same output path appears in both,
# the site YAML entry wins.
#
# Example:
# pages:
#   gs_extra:
#     output: index.md
#     title: "Platform overview"
#     confluence_pm_page_ids: ["123456789"]
#     confluence_dev_page_ids: []
#     prompt_profile: getting-started
#
# SEED_SECTION_PAGES filters by seed key: legacy:<key> or e.g. getting-started:overview
pages: {}
