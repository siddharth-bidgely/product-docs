# Tab title for the Features section (MkDocs hook). Inner entries use feature_doc (not page_doc).
# Confluence: confluence_pm_page_ids = product/PM specs; confluence_dev_page_ids = technical/DEV specs.
# Deprecated: confluence_page_ids (treated as PM if present).
display_name: Features
features:
  project-management:
    display_name: "Project Management"
    description: "1-click project and environment creation — provisions infrastructure, CMS content, and SaaS configuration automatically"
    confluence_pm_page_ids: ["847642630", "853245955", "853475347", "852557844"]
    confluence_dev_page_ids: []
    feature_doc: features/project-management.md
    service_docs:
      - repo: bidgely-quill
        code_paths:
          - src/api/utility/
          - src/api/utility-appliance-profile/
          - src/api/utility-home-profile/
          - src/api/utility-reco-score/
      - repo: bidgely-quill-fe
        code_paths:
          - src/features/utility/
          - src/features/cmsPilot/
          - src/features/pilot/
          - src/apis/pilotAPI.ts
          - src/apis/cmsPilotAPI.ts

  recommendations:
    display_name: "Recommendations"
    description: "Create, review, and publish energy recommendations with i18n and workflows"
    confluence_pm_page_ids: ["815431723", "633110556"]
    confluence_dev_page_ids: []
    context_docs:
      - repo: bidgely-quill-fe
        paths:
          - README.md
    feature_doc: features/recommendations.md
    api_doc: api/cms/recommendations-api.md
    openapi_spec: assets/openapi/recommendations.yaml
    service_docs:
      - repo: bidgely-quill
        code_paths:
          - src/api/recommendation/
      - repo: bidgely-quill-fe
        code_paths:
          - src/features/recommendations/
          - src/apis/recoAPI.ts

  survey-builder:
    display_name: "Survey Builder"
    description: "Build and manage survey templates, categories, and questions"
    confluence_pm_page_ids: ["948535302"]
    confluence_dev_page_ids: []
    feature_doc: features/survey-builder.md
    api_doc: api/cms/survey-api.md
    openapi_spec: assets/openapi/survey-builder.yaml
    service_docs:
      - repo: bidgely-quill
        code_paths:
          - src/api/survey-category/
          - src/api/survey-question/
          - src/api/survey-template/
      - repo: bidgely-quill-fe
        code_paths:
          - src/features/survey/
          - src/apis/surveyQBAPI.ts
          - src/apis/surveyTemplateAPI.ts

